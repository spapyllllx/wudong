<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- 苗族蝴蝶纹样简化版 -->
  <g transform="translate(60, 60)">
    <!-- 蝴蝶身体 -->
    <ellipse cx="0" cy="0" rx="4" ry="12" fill="#3d5a80"/>
    
    <!-- 左上翅膀 -->
    <path d="M -4 -5 Q -20 -15, -25 -25 Q -30 -30, -28 -35 Q -25 -40, -20 -38 Q -15 -36, -10 -30 Q -5 -20, -4 -10 Z" 
          fill="#e63946" opacity="0.8"/>
    <ellipse cx="-15" cy="-22" rx="5" ry="7" fill="#f4a261" opacity="0.6"/>
    
    <!-- 右上翅膀 -->
    <path d="M 4 -5 Q 20 -15, 25 -25 Q 30 -30, 28 -35 Q 25 -40, 20 -38 Q 15 -36, 10 -30 Q 5 -20, 4 -10 Z" 
          fill="#e63946" opacity="0.8"/>
    <ellipse cx="15" cy="-22" rx="5" ry="7" fill="#f4a261" opacity="0.6"/>
    
    <!-- 左下翅膀 -->
    <path d="M -4 5 Q -18 10, -22 18 Q -25 23, -23 27 Q -20 30, -16 28 Q -12 25, -8 20 Q -5 12, -4 8 Z" 
          fill="#2a9d8f" opacity="0.7"/>
    <ellipse cx="-13" cy="17" rx="4" ry="5" fill="#98c1d9" opacity="0.5"/>
    
    <!-- 右下翅膀 -->
    <path d="M 4 5 Q 18 10, 22 18 Q 25 23, 23 27 Q 20 30, 16 28 Q 12 25, 8 20 Q 5 12, 4 8 Z" 
          fill="#2a9d8f" opacity="0.7"/>
    <ellipse cx="13" cy="17" rx="4" ry="5" fill="#98c1d9" opacity="0.5"/>
    
    <!-- 触角 -->
    <path d="M -2 -12 Q -5 -18, -8 -20" stroke="#3d5a80" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 2 -12 Q 5 -18, 8 -20" stroke="#3d5a80" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="-8" cy="-20" r="2" fill="#e63946"/>
    <circle cx="8" cy="-20" r="2" fill="#e63946"/>
  </g>
</svg>
