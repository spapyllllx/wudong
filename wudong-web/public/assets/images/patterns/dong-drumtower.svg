<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 200" width="150" height="200">
  <!-- 侗族鼓楼剪影 -->
  <g fill="#3d5a80" opacity="0.8">
    <!-- 基座 -->
    <rect x="30" y="170" width="90" height="30" rx="2"/>
    
    <!-- 第一层 -->
    <path d="M 25 170 L 35 150 L 115 150 L 125 170 Z"/>
    <rect x="35" y="140" width="80" height="10"/>
    
    <!-- 第二层 -->
    <path d="M 30 140 L 40 120 L 110 120 L 120 140 Z"/>
    <rect x="40" y="110" width="70" height="10"/>
    
    <!-- 第三层 -->
    <path d="M 35 110 L 45 90 L 105 90 L 115 110 Z"/>
    <rect x="45" y="80" width="60" height="10"/>
    
    <!-- 第四层 -->
    <path d="M 40 80 L 50 60 L 100 60 L 110 80 Z"/>
    <rect x="50" y="50" width="50" height="10"/>
    
    <!-- 顶层 -->
    <path d="M 45 50 L 55 30 L 95 30 L 105 50 Z"/>
    <rect x="55" y="20" width="40" height="10"/>
    
    <!-- 尖顶 -->
    <path d="M 65 20 L 75 5 L 85 20 Z"/>
    <circle cx="75" cy="3" r="3"/>
    
    <!-- 装饰性横线 -->
    <line x1="35" y1="145" x2="115" y2="145" stroke="#2a9d8f" stroke-width="1" opacity="0.6"/>
    <line x1="40" y1="115" x2="110" y2="115" stroke="#2a9d8f" stroke-width="1" opacity="0.6"/>
    <line x1="45" y1="85" x2="105" y2="85" stroke="#2a9d8f" stroke-width="1" opacity="0.6"/>
    <line x1="50" y1="55" x2="100" y2="55" stroke="#2a9d8f" stroke-width="1" opacity="0.6"/>
  </g>
</svg>
